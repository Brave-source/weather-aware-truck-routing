services:
  - type: web
    name: weather-aware-truck-routing-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: python -m gunicorn config.wsgi:application
    healthCheckPath: /api/health/
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.17
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "false"
      - key: MAPBOX_ACCESS_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        fromService:
          type: web
          name: weather-aware-truck-routing-web
          envVarKey: RENDER_EXTERNAL_URL

  - type: web
    name: weather-aware-truck-routing-web
    runtime: static
    rootDir: frontend
    buildCommand: 'npm ci && VITE_API_BASE_URL="${API_ORIGIN}/api" npm run build'
    staticPublishPath: dist
    envVars:
      - key: API_ORIGIN
        fromService:
          type: web
          name: weather-aware-truck-routing-api
          envVarKey: RENDER_EXTERNAL_URL
      - key: VITE_MAPBOX_ACCESS_TOKEN
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
